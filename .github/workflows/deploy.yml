name: Rust
on: 
  push:
    paths:
      - src
      - Cargo.toml
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release permissison
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Build
      run: cargo build --verbose
    - name: Build a tarball
      run: bash -c 'mkdir tarball \
        mkdir tarball/etc/systemd/system -p \
        mkdir tarball/usr/bin -p \
        cp target/debug/bobert tarball/usr/bin \
        touch tarball/etc/systemd/system/bobert.service'
    - name: Test directory structure
      run: ls -la
    - name: Release
      uses: softprops/action-gh-release@v3
      # make an release only on tag
      if: github.ref_type == 'tag'
      with:
        files: target/debug/bobert