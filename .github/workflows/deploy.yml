name: Rust
on: 
  push:
    paths:
      - src/**
      - Cargo.toml
      - ".github/workflows/rust.yml"
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release permissison
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Build
      if: github.ref_type != 'tag'
      run: cargo build --verbose
    - name: Build for release
      if: github.ref_type == 'tag'
      run: cargo build --verbose --release
    - name: Package tarball
      run: |
        set -euo pipefail
        mkdir -p "tarball/usr/bin"
        mkdir -p "tarball/etc/systemd/system"
        cp target/release/bobert "tarball/usr/bin/"
        touch target/etc/systemd/system/bobert.service
        tar -C tarball -czf "bobert.tar.gz"
    - name: Test directory structure
      run: ls -la
    - name: Release
      uses: softprops/action-gh-release@v3
      # make an release only on tag
      if: github.ref_type == 'tag'
      with:
        files: |
          target/release/bobert
          bobert.tar.gz